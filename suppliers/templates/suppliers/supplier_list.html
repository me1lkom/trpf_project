{% extends 'base.html' %}

{% block title %}
  Поставщики
{% endblock %}

{% block content %}
  <h1>Поставщики</h1>
  <form class="d-flex mb-3" method="get">
    <div class="input-group">
      <input type="search" name="search" class="form-control" placeholder="Поиск..." value="{{ search }}" />
      <button class="btn btn-primary" type="submit">Найти</button>
    </div>
  </form>
  {% for supplier in suppliers %}
    {% include 'suppliers/includes/supplier_card.html' %}
  {% empty %}
    <p>Поставщики не найдены</p>
  {% endfor %}
{% endblock %}
